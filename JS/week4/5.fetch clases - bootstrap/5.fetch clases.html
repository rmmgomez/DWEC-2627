<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
  <script type="module" src="5.fetch clases.js"></script>
</head>

<body class="container py-4">
  <header>
    <h1 class="text-center">Ejemplo de producto</h1>
  </header>
  <div class="row g-4 justify-content-start grid-container py-4">
    <!-- <div class="alert alert-danger d-none" role="alert">
      No hay productos
    </div> -->
  </div>

  <form id="formProducto" class="py-4">
    <h2>Añade un nuevo producto: </h2>
    <div class="mb-3">
      <label for="description" class="form-label">Descripción del producto:
      </label>
      <input type="text" class="form-control" id="description" placeholder="Descripción..." required />
    </div>
    <div class="mb-3">
      <label for="price" class="form-label">Precio del producto: </label>
      <input type="number" class="form-control" id="price" required />
    </div>
    <div class="mb-3">
      <label for="image" class="form-label">Imagen: </label>
      <input type="file" class="form-control" id="image" required />
    </div>
    <p><img id="imgPreview" src="" /></p>
    <!-- Para previsualizar la imagen seleccionada -->
    <button type="submit" class="btn btn-primary">Añadir</button>
  </form>

  <template id="card-template">
    <div class="col-12 col-sm-6 col-md-4 col-xl-3 text-center">
      <div class="card h-100">
        <img src="..." class="card-img-top" alt="Inserta aquí la imagen">
        <div class="card-body">
          <h5 class="card-description fw-bold"></h5>
          <p class="card-price"></p>
          <button type="button" class="btn btn-danger">Borrar</button>
        </div>
        <div class="card-footer card-available"></div>
      </div>
    </div>
  </template>
</body>

</html>
