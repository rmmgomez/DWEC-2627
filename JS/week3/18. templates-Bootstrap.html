<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
    integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
  <title>Ejemplo tabla con Boostrap</title>
  <script src="18. templates-Bootstrap.js" defer></script>
  <style>
    img {
      width: 300px;
    }
  </style>
</head>

<body>
  <form id="formPersona">
    <p><input type="text" name="nombre" placeholder="Nombre" required></p>
    <p>
      Aficiones:
      <input type="checkbox" name="hobbies" value="tenis"> Tenis
      <input type="checkbox" name="hobbies" value="comer"> Comer
      <input type="checkbox" name="hobbies" value="viajar"> Viajar
      <input type="checkbox" name="hobbies" value="caminar"> Caminar
    </p>
    <p>Avatar: <input type="file" id="avatar" name="avatar" required accept="image/*"></p>
    <p><img src="" alt="" id="imgPreview"></p>
    <button type="submit">Añadir</button>
  </form>

  <table id="users" class="table">
    <thead>
      <tr>
        <th scope="col">Avatar</th>
        <th scope="col">Nombre</th>
        <th scope="col">Aficiones</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td><img src="gant.png" alt=""></td>
        <td>dsadas</td>
        <td>dasdsa</td>
      </tr>
    </tbody>
  </table>

  <template id="templateRow">
    <tr>
      <td class="fila1"><img src="" alt=""></td>
      <td class="fila2"></td>
      <td class="fila3"></td>
    </tr>
  </template>
</body>

</html>
